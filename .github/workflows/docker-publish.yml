name: Build and publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and publish GHCR images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Fan UI image metadata
        id: meta_ui
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rickdb/truenas-fan-ui
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Generate IT87 loader image metadata
        id: meta_it87
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rickdb/truenas-fan-ui-it87-loader
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Fan UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_ui.outputs.tags }}
          labels: ${{ steps.meta_ui.outputs.labels }}
          cache-from: type=gha,scope=fan-ui
          cache-to: type=gha,mode=max,scope=fan-ui

      - name: Build and push IT87 loader image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./it87-loader/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_it87.outputs.tags }}
          labels: ${{ steps.meta_it87.outputs.labels }}
          cache-from: type=gha,scope=it87-loader
          cache-to: type=gha,mode=max,scope=it87-loader
